name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sources:
    name: Markdown, links and Python blocks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_book.py
      - name: Display equations typeset
        run: |
          pip install -r tools/requirements.txt
          python tools/check_equations.py
      - name: Flashcards are up to date
        run: python tools/export_flashcards.py --check

  code:
    name: Chapter scripts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - name: Install (CPU-only PyTorch)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r code/requirements.txt
      - run: python tools/run_code.py
